# Momentum-Trend configuration — strategy redesign 2026-05-31.
#
# Path so far: matched-pair maker (no edge, adverse selection) → favorite-harvester
# (favorite-longshot bias; +EV on tape but win%≈price live, did NOT replicate) →
# MOMENTUM-TREND (this). A 2-day tape study (scripts/momentum-yes-sim.ts) found
# 5-min crypto windows autocorrelate strongly: prior-300s up → window finishes UP
# ~64% (vs 49.8% base), down → ~35%. The fresh window's book opens ~50/50 before
# pricing that continuation, so entering EARLY (~270s) and betting WITH the trend
# (up→YES, down→NO), held to resolution, is +EV. Validated +9-10% ROI on BOTH days
# and ALL 6 assets (win 59-71%). This is the inverse of the harvester's failure:
# we enter EARLY (book not yet efficient, win% >> price) instead of late.
#
# ⚠️ LIVE (real money) per user decision 2026-05-31. Risk is bounded by clip size
# + daily/session halts. NOTE: the momentum signal needs ~4 min of price history
# after launch before it fires (the 300s buffer must fill).
#
# `live.enabled` below is the real-vs-paper switch (NOT the DRY_RUN env var).

assets: [BTC, ETH, SOL, XRP, BNB, DOGE]

maker:
  # ── MOMENTUM-TREND (active strategy) ──────────────────────────────────────
  momentum_trend: true
  # Enter just after the window opens (~270s to resolve on a 5-min window). The
  # signal is the prior-window move; the fresh book hasn't priced it yet.
  momentum_enter_sec: 270
  # Floor — stop entering once the signal stales late in the window.
  momentum_exit_sec: 120
  # Lookback for the underlying momentum signal. 300s (one prior window) was the
  # day-stable sweet spot; 120s and 600s were NOT stable (one day negative).
  momentum_lookback_sec: 300
  # |prior return| must exceed this to take a side. 0.10%: the 0.05-0.10% bucket
  # was NOISE (53% win, -EV) on BOTH tape days and dragged the strategy down;
  # >=0.10% won 68-77%. Raising 0.05%->0.10% lifts ROI ~+9.5% -> ~+16% (validated).
  momentum_threshold: 0.0010
  # Conviction sizing: win% rises with the move (68%->77% as |r| grows), so size up
  # 2x on strong signals (>=0.20%). Bounded by ask depth + max_deployed.
  momentum_strong_threshold: 0.0020
  momentum_strong_mult: 2
  # BOTH directions (user pref 2026-05-31): YES on uptrends, NO on downtrends —
  # trade WITH the trend either way. The DOWN half is the better-performing half on
  # the tape (BTC both-sides +10% ROI vs long-only +6.2%), so keeping it is correct.
  momentum_long_only: false
  # Don't chase: past ~0.80 the book has already priced the move (edge gone).
  momentum_max_ask: 0.80
  # Base taker clip (5 sh = venue min ≈ $2.6/window/asset at ~0.52 entry; 10 on strong).
  momentum_clip_shares: 5

  # ── FAVORITE HARVESTER (legacy, disabled — superseded by momentum_trend) ──
  favorite_harvester: false
  harvest_enter_sec: 90
  harvest_exit_sec: 30
  harvest_min_mid: 0.60
  harvest_max_ask: 0.85
  harvest_clip_shares: 5

  # ── Shared knobs (still parsed; the maker quote/flatten phases are bypassed
  #    while favorite_harvester is true, so these only matter if you flip back) ──
  half_spread: 0.03
  half_spread_by_asset:
    XRP: 0.015
    SOL: 0.01
  quote_size_usd: 1.0
  min_quote_shares: 5.0            # venue min_order_size floor (also the harvest min clip)
  inventory_skew_k: 0.2
  widen_factor: 2.5
  max_inventory_usd: 3
  tick_size: 0.01
  disable_sell: false
  quote_price_min: 0.05
  quote_price_max: 0.95
  max_buy_price: 0.50
  max_unmatched_shares: 5
  max_spend_per_leg_usd: 8
  replace_deadband_ticks: 4
  min_pair_profit_per_share: 0.02
  taker_complete: false           # legacy pair-maker feature; off under the harvester
  no_trade_band_50: 0
  no_new_entry_before_sec: 90
  vol_halt_return_30s: 0.0025
  min_book_depth_shares: 0
  adverse_guard:
    btc_return_30s_widen: 0.0005
    btc_return_30s_pull: 0.0020
  flatten_before_sec: 30
  flatten_if_net_above_usd: 5.0

  # Taker fee schedule (real Polymarket: shares * rate * p*(1-p)). Drives the
  # harvest_max_ask room calc and the shadow-P&L fee deduction.
  fill_participation: 1.0
  taker_fee_rate: 0.07

risk:
  daily_loss_limit_usd: 15.0
  max_committed_usd: 12.0

live:
  # ⚠️ THIS is the real-vs-paper switch (NOT the DRY_RUN env var, which only gets
  # logged and does NOT gate orders). enabled:true = REAL on-chain orders.
  # enabled:false = paper: the loop runs and logs harvest intent + shadow P&L but
  # places NO orders. Set to true ONLY when you deliberately want live trading.
  enabled: true
  # BTC only for now (user pref 2026-05-31, one asset at a time). NOTE: in the tape
  # BTC was the WEAKEST of the 6 (+6.2% long-only vs +17% pooled), and a single
  # asset = no diversification = higher variance (~10-12 windows/hr, fewer with
  # long-only). Add ETH/XRP/SOL later for a smoother curve.
  assets: [BTC]
  # 1 asset × up to 10 sh (strong) × ~$0.55 ≈ $5.5; 10 gives headroom.
  max_deployed_usd: 10
  # ⚠️ HALT SIZING TRADEOFF: each loss is ~$2.6 (5 sh × ~0.52). The strategy wins
  # ~65% but has variance — a $5 halt would trip on 2 normal early losses and never
  # let the edge compound. $10 daily / $20 session gives room to ride variance while
  # bounding the downside. Raise/lower to YOUR risk tolerance.
  daily_loss_halt_usd: 10
  session_loss_halt_usd: 20
  poll_interval_ms: 750
  reconcile_every_sec: 2
  reconcile_correct: true
  reconcile_min_persist_ms: 60000
  cash_floor_usd: 5
  net_worth_halt_usd: 30
  # ~50 resolved windows ≈ 8/asset — a meaningful batch to judge the live edge.
  session_max_windows: 50
  session_take_profit_usd: 0
  session_max_consec_losses: 0     # disabled: momentum clusters losses in choppy patches; rely on $ halts
