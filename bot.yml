# Favorite Harvester configuration — strategy redesign 2026-05-30.
#
# The matched-pair maker had no edge (adverse selection: you only fill the losing
# side — proven live over 4 negative sessions). A 2-day tape study (scripts/
# lag-study.ts + favorite-maker-sim.ts) killed the directional/lag taker too (the
# market is efficient) but found ONE edge that survives fees: the favorite-
# longshot bias, harvested as a TAKER. Late in each window we cross the spread to
# BUY the book's FAVORITE (mid >= 0.60) and HOLD to resolution. Validated +EV on
# the less-efficient books (DOGE +8-13% ROI, XRP +6-7%, day-stable); negative on
# the efficient majors (BNB/ETH — tight spreads eat the bias) so they are excluded.
#
# PAPER MODE is controlled by `live.enabled` below (false = no real orders). In
# paper mode the harvester logs intended taker buys and scores them on the real
# settle (harvest_result.hypoPnl / summary.harvestShadowUsd) without placing
# orders — a live shadow-backtest. Watch harvestShadowUsd trend up.

assets: [BTC, ETH, SOL, XRP, BNB, DOGE]

maker:
  # ── FAVORITE HARVESTER (active strategy) ──────────────────────────────────
  favorite_harvester: true
  # Begin hunting for a favorite in the last 90s; stop entering at 30s-to-go
  # (matches the backtest's best T_enter band of 90-60s on a 5-minute window).
  harvest_enter_sec: 90
  harvest_exit_sec: 30
  # A leg is the favorite when mid >= this. 0.60 = conviction 10% (the backtest's
  # most robust threshold across both days/assets).
  harvest_min_mid: 0.60
  # Never pay an ask above this. The favorite-bias EV per trade is ~constant with
  # price (the bias gap), but VARIANCE explodes at high ask: a flip at 0.88 loses
  # -0.88 while a win pays only +0.12. The first live batch (2026-05-30) lost on
  # exactly two expensive-favorite flips (0.88, 0.73) that wiped 8 small wins.
  # Lowered 0.90 -> 0.85 to cut the blow-up trades for negligible EV loss
  # (recomputed: that batch flips from -$1.50 to +$1.44).
  harvest_max_ask: 0.85
  # Taker clip per harvest entry. 5 sh ≈ $4/window/asset; with 1 entry/window and
  # 2 assets the bot risks at most ~$8 concurrently. Bounded by design.
  harvest_clip_shares: 5

  # ── Shared knobs (still parsed; the maker quote/flatten phases are bypassed
  #    while favorite_harvester is true, so these only matter if you flip back) ──
  half_spread: 0.03
  half_spread_by_asset:
    XRP: 0.015
    SOL: 0.01
  quote_size_usd: 1.0
  min_quote_shares: 5.0            # venue min_order_size floor (also the harvest min clip)
  inventory_skew_k: 0.2
  widen_factor: 2.5
  max_inventory_usd: 3
  tick_size: 0.01
  disable_sell: false
  quote_price_min: 0.05
  quote_price_max: 0.95
  max_buy_price: 0.50
  max_unmatched_shares: 5
  max_spend_per_leg_usd: 8
  replace_deadband_ticks: 4
  min_pair_profit_per_share: 0.02
  taker_complete: false           # legacy pair-maker feature; off under the harvester
  no_trade_band_50: 0
  no_new_entry_before_sec: 90
  vol_halt_return_30s: 0.0025
  min_book_depth_shares: 0
  adverse_guard:
    btc_return_30s_widen: 0.0005
    btc_return_30s_pull: 0.0020
  flatten_before_sec: 30
  flatten_if_net_above_usd: 5.0

  # Taker fee schedule (real Polymarket: shares * rate * p*(1-p)). Drives the
  # harvest_max_ask room calc and the shadow-P&L fee deduction.
  fill_participation: 1.0
  taker_fee_rate: 0.07

risk:
  daily_loss_limit_usd: 15.0
  max_committed_usd: 12.0

live:
  # ⚠️ THIS is the real-vs-paper switch (NOT the DRY_RUN env var, which only gets
  # logged and does NOT gate orders). enabled:true = REAL on-chain orders.
  # enabled:false = paper: the loop runs and logs harvest intent + shadow P&L but
  # places NO orders. Set to true ONLY when you deliberately want live trading.
  enabled: true
  # Only the assets where the favorite-bias survived the taker cross (validated
  # 2-day, day-stable). BNB/ETH excluded (negative after fees); SOL/BTC marginal.
  assets: [DOGE, XRP]
  max_deployed_usd: 20
  daily_loss_halt_usd: 5
  session_loss_halt_usd: 10
  poll_interval_ms: 750
  reconcile_every_sec: 2
  reconcile_correct: true
  reconcile_min_persist_ms: 60000
  cash_floor_usd: 5
  net_worth_halt_usd: 15
  session_max_windows: 30
  session_take_profit_usd: 0
  session_max_consec_losses: 0     # disabled: dry-run books no realized losses (shadow only)
